name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Complete cross-platform verification
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  package:
    name: Build verified release assets
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22.19
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        id: version
        shell: bash
        run: |
          package_version="$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; process.stdout.write(pkg.version)")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Build release assets
        shell: bash
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          archive="dsh-universe-api-${{ steps.version.outputs.package_version }}.tgz"
          test -f "dist/$archive"
          test -f data/update_report.json
          (
            cd dist
            sha256sum "$archive" > "$archive.sha256"
          )
          cp data/update_report.json dist/catalog-update-report.json

      - name: Preserve verified assets with the workflow run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dsh-universe-api-${{ steps.version.outputs.package_version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dsh-universe-api-${{ needs.package.outputs.package_version }}
          path: dist

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
        run: |
          release_flags=()
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "${release_flags[@]}"
